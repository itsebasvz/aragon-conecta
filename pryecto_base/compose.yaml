name: semana-ingenieria
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${BD_NOMBRE:-semana_ingenieria}
      MARIADB_USER: ${BD_USUARIO:-semana}
      MARIADB_PASSWORD: ${BD_CLAVE:?Configura BD_CLAVE en .env}
      MARIADB_ROOT_PASSWORD: ${BD_ROOT_CLAVE:?Configura BD_ROOT_CLAVE en .env}
    ports:
      - "127.0.0.1:${BD_PORT:-3307}:3306"
    volumes:
      - datos-mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    profiles: ["web"]
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 2800
      BD_HOST: db
      BD_PORT: 3306
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "127.0.0.1:${PORT:-2800}:2800"
    depends_on:
      db:
        condition: service_healthy
  db-test:
    profiles: ["test"]
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: semana_ingenieria_test
      MARIADB_USER: ${BD_USUARIO:-semana}
      MARIADB_PASSWORD: ${BD_CLAVE:?Configura BD_CLAVE en .env}
      MARIADB_ROOT_PASSWORD: ${BD_ROOT_CLAVE:?Configura BD_ROOT_CLAVE en .env}
    ports:
      - "127.0.0.1:${TEST_BD_PORT:-3308}:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 20
volumes:
  datos-mariadb:
